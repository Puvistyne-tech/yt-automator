[project]
name = "automator"
version = "0.1.0"
description = "YouTube Automator backend: channels, automations, pipelines and runs."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.164.0",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "keyring>=25.7.0",
    "pydantic>=2.9",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-oauthlib>=4.0.0.20261107",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RET", "ARG", "ERA", "T20", "FIX", "TD", "C90", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 40

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: touches the filesystem, a database or a subprocess"]
